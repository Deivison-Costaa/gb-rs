name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
      # Até o ROADMAP 0.1 não existe workspace Cargo. Sem esta guarda a CI
      # nasce vermelha, e a proteção de branch (exige check verde) trava o
      # projeto já no primeiro PR. A guarda some sozinha quando 0.1 entrar.
      - id: workspace
        run: |
          if [ -f Cargo.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Sem workspace Cargo::Cargo.toml ainda não existe (ROADMAP 0.1). fmt/clippy/test pulados."
          fi
      - if: steps.workspace.outputs.exists == 'true'
        run: cargo fmt --all -- --check
      - if: steps.workspace.outputs.exists == 'true'
        run: cargo clippy --all-targets -- -D warnings
      - if: steps.workspace.outputs.exists == 'true'
        run: cargo test --all

  scoreboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/fetch-test-roms.sh
      - run: ./scripts/scoreboard.sh
      # O CSV acumulado é o gráfico da apresentação. Não perca.
      - uses: actions/upload-artifact@v4
        with:
          name: scoreboard-${{ github.sha }}
          path: scoreboard.csv
